[package]
name = "voice-scheduler"
version = "0.1.0"
edition = "2024"
description = "Bounded Tokio speech-serving gateway with persistent model workers and fair turn scheduling"
license = "MIT"
repository = "https://github.com/BertilBraun/rust-speech-runtime"

[dependencies]
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
hdrhistogram = "7.5"
futures-util = { version = "0.3", features = ["sink"] }
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs", "net", "io-util", "process"] }
tokio-util = "0.7"
tokio-tungstenite = "0.30"

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
