[package]
name = "voice-scheduler"
version = "0.1.0"
edition = "2024"
description = "Bounded, deadline-aware Tokio runtime for simulated realtime voice inference"
license = "MIT"

[dependencies]
blake3 = "1.8"
bincode = { version = "2.0", features = ["serde"] }
bytes = { version = "1.10", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
cpu-time = "1.0"
hdrhistogram = "7.5"
futures-util = { version = "0.3", features = ["sink"] }
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs", "net", "io-util", "io-std", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
