[package]
name = "voice-scheduler"
version = "0.1.0"
edition = "2024"
description = "Bounded, deadline-aware Tokio runtime for simulated realtime voice inference"
license = "MIT"

[dependencies]
blake3 = "1.8"
bytes = { version = "1.10", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hdrhistogram = "7.5"
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs", "net", "io-util", "test-util"] }
tokio-util = "0.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
